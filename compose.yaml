services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nawa
      POSTGRES_USER: nawa
      POSTGRES_PASSWORD: nawa_local
    ports:
      - "5439:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nawa -d nawa"]
      interval: 2s
      timeout: 2s
      retries: 20

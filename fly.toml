# fly.toml app configuration for https://fly.io
# Create app + Postgres: fly launch (or fly apps create) then attach a Postgres DB.

app = "nawa-arabic"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  ENABLE_PUBLIC_DEMO = "false"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
